name: CICD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Echo my name
        run: echo "My name is Hakeem Ullah"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install flake8
        run: pip install flake8

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/my-app:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/my-app:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/my-app:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/my-app:latest

      - name: Deploy Docker image on VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: DOCKER_USERNAME,GITHUB_REPOSITORY
          script: |
            set -e

            APP_DIR="$HOME/FlaskWebApp-Devops"

            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git pull origin main
            else
              git clone "https://github.com/$GITHUB_REPOSITORY.git" "$APP_DIR"
              cd "$APP_DIR"
            fi

            docker compose pull
            docker compose up -d
