name: CI/CD Pipeline
 
on:
  push:
    branches:
      - main
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
 
      - name: Build and tag image
        run: |
          docker build -t hakeemullahjan/my-app:latest -t hakeemullahjan/my-app:${{ github.sha }} .
 
      - name: Push image
        run: |
          docker push hakeemullahjan/my-app:latest
          docker push hakeemullahjan/my-app:${{ github.sha }}
 
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
           
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
 
           
            
            cd ~/app
 
           
            sudo sed -i "s|image: hakeemullahjan/my-app:.*|image: hakeemullahjan/my-app:${{ github.sha }}|" docker-compose.yml
 
           
            sudo docker compose pull
 
           
            sudo docker compose up -d