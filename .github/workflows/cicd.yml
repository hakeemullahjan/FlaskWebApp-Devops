name: CICD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Echo my name
        run: echo "My name is Hakeem Ullah"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install flake8
        run: pip install flake8

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/my-app:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/my-app:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/my-app:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/my-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Docker image on VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: DOCKER_USERNAME,GITHUB_REPOSITORY
          script: |
            set -e

            APP_DIR="$HOME/FlaskWebApp-Devops"

            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git pull origin main
            else
              git clone "https://github.com/$GITHUB_REPOSITORY.git" "$APP_DIR"
              cd "$APP_DIR"
            fi

            if ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; then
              echo "Docker Compose not found. Attempting installation..."

              if command -v sudo >/dev/null 2>&1; then
                SUDO="sudo"
              else
                SUDO=""
              fi

              if command -v apt-get >/dev/null 2>&1; then
                $SUDO apt-get update -y
                $SUDO apt-get install -y docker-compose-plugin || $SUDO apt-get install -y docker-compose || true
                $SUDO apt-get install -y curl wget || true
              fi

              if ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; then
                ARCH="$(uname -m)"
                case "$ARCH" in
                  x86_64) COMPOSE_ARCH="x86_64" ;;
                  aarch64|arm64) COMPOSE_ARCH="aarch64" ;;
                  *) echo "Unsupported architecture for Docker Compose binary install: $ARCH"; exit 1 ;;
                esac

                mkdir -p "$HOME/.docker/cli-plugins"
                if command -v curl >/dev/null 2>&1; then
                  curl -fsSL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-${COMPOSE_ARCH}" -o "$HOME/.docker/cli-plugins/docker-compose"
                elif command -v wget >/dev/null 2>&1; then
                  wget -q "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-${COMPOSE_ARCH}" -O "$HOME/.docker/cli-plugins/docker-compose"
                else
                  echo "Neither curl nor wget is available to download Docker Compose."
                  exit 1
                fi
                chmod +x "$HOME/.docker/cli-plugins/docker-compose"
              fi
            fi

            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Docker Compose installation failed."
              exit 1
            fi

            $COMPOSE_CMD pull
            $COMPOSE_CMD up -d
