name: CICD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Echo my name
        run: echo "My name is Hakeem Ullah"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install flake8
        run: pip install flake8

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/my-app:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/my-app:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/my-app:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/my-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Docker image on VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,GITHUB_SHA
          script: |
            set -e

            DEPLOY_DIR="$HOME/flaskwebapp-deploy"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            if docker info >/dev/null 2>&1; then
              DOCKER_CMD="docker"
            elif command -v sudo >/dev/null 2>&1 && sudo -n docker info >/dev/null 2>&1; then
              DOCKER_CMD="sudo --preserve-env=DOCKER_USERNAME,DOCKER_PASSWORD docker"
            else
              echo "Docker daemon is not accessible for user '$USER'. Grant docker group access or passwordless sudo for docker."
              exit 1
            fi

            if [ -z "$DOCKER_USERNAME" ]; then
              echo "DOCKER_USERNAME is empty on the VM session. Check GitHub secret DOCKER_USERNAME and appleboy envs forwarding."
              exit 1
            fi

            if [ -z "$DOCKER_PASSWORD" ]; then
              echo "DOCKER_PASSWORD is empty on the VM session. Check GitHub secret DOCKER_PASSWORD and appleboy envs forwarding."
              exit 1
            fi

            if [ -z "$GITHUB_SHA" ]; then
              echo "GITHUB_SHA is empty on the VM session. Check appleboy env forwarding."
              exit 1
            fi

            if [ ! -f "docker-compose.yml" ]; then
              echo "docker-compose.yml not found in $DEPLOY_DIR."
              exit 1
            fi

            if [ -f ".env" ]; then
              if grep -q '^IMAGE_TAG=' .env; then
                sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$GITHUB_SHA/" .env
              else
                echo "IMAGE_TAG=$GITHUB_SHA" >> .env
              fi
            else
              printf 'IMAGE_TAG=%s\n' "$GITHUB_SHA" > .env
            fi

            if ! $DOCKER_CMD compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; then
              echo "Docker Compose not found. Attempting installation..."

              if command -v sudo >/dev/null 2>&1; then
                SUDO="sudo"
              else
                SUDO=""
              fi

              if command -v apt-get >/dev/null 2>&1; then
                $SUDO apt-get update -y
                $SUDO apt-get install -y docker-compose-plugin || $SUDO apt-get install -y docker-compose || true
                $SUDO apt-get install -y curl wget || true
              fi

              if ! $DOCKER_CMD compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; then
                ARCH="$(uname -m)"
                case "$ARCH" in
                  x86_64) COMPOSE_ARCH="x86_64" ;;
                  aarch64|arm64) COMPOSE_ARCH="aarch64" ;;
                  *) echo "Unsupported architecture for Docker Compose binary install: $ARCH"; exit 1 ;;
                esac

                mkdir -p "$HOME/.docker/cli-plugins"
                if command -v curl >/dev/null 2>&1; then
                  curl -fsSL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-${COMPOSE_ARCH}" -o "$HOME/.docker/cli-plugins/docker-compose"
                elif command -v wget >/dev/null 2>&1; then
                  wget -q "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-${COMPOSE_ARCH}" -O "$HOME/.docker/cli-plugins/docker-compose"
                else
                  echo "Neither curl nor wget is available to download Docker Compose."
                  exit 1
                fi
                chmod +x "$HOME/.docker/cli-plugins/docker-compose"
              fi
            fi

            if $DOCKER_CMD compose version >/dev/null 2>&1; then
              COMPOSE_CMD="$DOCKER_CMD compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              if [ "$DOCKER_CMD" = "sudo --preserve-env=DOCKER_USERNAME,DOCKER_PASSWORD docker" ]; then
                COMPOSE_CMD="sudo --preserve-env=DOCKER_USERNAME,DOCKER_PASSWORD docker-compose"
              else
                COMPOSE_CMD="docker-compose"
              fi
            else
              echo "Docker Compose installation failed."
              exit 1
            fi

            cleanup_port_8000_containers() {
              PORT_CONTAINERS="$($DOCKER_CMD ps --filter publish=8000 --format '{{.ID}} {{.Names}}')"
              if [ -n "$PORT_CONTAINERS" ]; then
                echo "Port 8000 is currently in use. Cleaning conflicting containers..."
                while read -r CONTAINER_ID CONTAINER_NAME; do
                  if [ -n "$CONTAINER_ID" ]; then
                    $DOCKER_CMD stop "$CONTAINER_ID" || true
                    $DOCKER_CMD rm "$CONTAINER_ID" || true
                    echo "Removed container $CONTAINER_NAME ($CONTAINER_ID)"
                  fi
                done <<< "$PORT_CONTAINERS"
              fi
            }

            # Pre-clean stale containers that may block app port.
            cleanup_port_8000_containers

            $COMPOSE_CMD pull

            set +e
            UP_OUTPUT="$($COMPOSE_CMD up -d --remove-orphans --force-recreate 2>&1)"
            UP_EXIT=$?
            set -e

            if [ $UP_EXIT -ne 0 ]; then
              echo "$UP_OUTPUT"
              if echo "$UP_OUTPUT" | grep -Eq "port is already allocated|Bind for 0.0.0.0:8000 failed"; then
                echo "Port conflict detected after compose up. Retrying after cleanup..."
                cleanup_port_8000_containers
                $COMPOSE_CMD up -d --remove-orphans --force-recreate
              else
                exit $UP_EXIT
              fi
            fi
